name: CI
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install optional io_uring headers
        run: sudo apt-get update && sudo apt-get install -y liburing-dev
      - name: Build
        run: make -j2
      - name: Test
        run: make test
